<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Corner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-w: 260px;
      --sidebar-bg: #0f172a;
      --sidebar-surface: #1e293b;
      --sidebar-hover: #334155;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --accent-dim: rgba(99, 102, 241, 0.12);
      --accent-glow: rgba(99, 102, 241, 0.25);
      --text: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --border-subtle: #f1f5f9;
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-raised: #ffffff;
      --code-bg: #f1f5f9;
      --code-color: #6366f1;
      --strong-color: #1a202c;
      --radius: 10px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow: 0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 40px rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.06);
      --theme-transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    /* ── Dark theme overrides ── */
    [data-theme="dark"] {
      --text: #e2e8f0;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border: #2d3748;
      --border-subtle: #1e293b;
      --bg: #0d1117;
      --surface: #161b22;
      --surface-raised: #1e2530;
      --code-bg: #1e2530;
      --code-color: #a5b4fc;
      --strong-color: #f1f5f9;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
      --shadow: 0 4px 16px rgba(0,0,0,0.4), 0 1px 4px rgba(0,0,0,0.2);
      --shadow-lg: 0 10px 40px rgba(0,0,0,0.5), 0 4px 12px rgba(0,0,0,0.3);
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      transition: var(--theme-transition);
    }

    /* ── Mobile header ── */
    .mobile-header {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: var(--sidebar-bg);
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .mobile-header h1 {
      font-size: 0.95rem;
      font-weight: 600;
      flex: 1;
      letter-spacing: -0.01em;
    }
    .mobile-header select {
      background: var(--sidebar-surface);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: var(--radius);
      padding: 7px 12px;
      font-size: 0.82rem;
      cursor: pointer;
      font-family: inherit;
    }

    /* ── Layout ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      height: 100%;
    }

    /* ── Sidebar ── */
    aside {
      width: var(--sidebar-w);
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      border-right: 1px solid rgba(255,255,255,0.04);
    }

    .sidebar-header {
      padding: 28px 20px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .brand-icon svg {
      width: 16px;
      height: 16px;
      stroke: white;
    }

    .brand-text {
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      color: rgba(255,255,255,0.35);
      font-size: 0.72rem;
      margin-top: 2px;
      letter-spacing: 0.04em;
    }

    .sidebar-section-title {
      padding: 20px 20px 8px;
      color: rgba(255,255,255,0.3);
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .date-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 12px 20px;
    }
    .date-list::-webkit-scrollbar { width: 3px; }
    .date-list::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
    }
    .date-list::-webkit-scrollbar-track { background: transparent; }

    .date-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius);
      color: rgba(255,255,255,0.6);
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      transition: background 0.15s, color 0.15s;
      position: relative;
    }
    .date-item:hover {
      background: var(--sidebar-hover);
      color: rgba(255,255,255,0.9);
    }
    .date-item.active {
      background: var(--accent-dim);
      color: var(--accent-light);
    }
    .date-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 60%;
      background: var(--accent);
      border-radius: 0 2px 2px 0;
    }

    .date-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .date-item.active .date-dot { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }

    .date-info { flex: 1; min-width: 0; }
    .date-item .label {
      display: block;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .date-item .sub {
      font-size: 0.72rem;
      opacity: 0.5;
      margin-top: 1px;
    }

    .sidebar-footer {
      padding: 14px 20px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .entry-count {
      color: rgba(255,255,255,0.3);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
    }

    /* ── Theme toggle button ── */
    .theme-toggle {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .theme-toggle:hover {
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.9);
      border-color: rgba(255,255,255,0.2);
    }
    .theme-toggle svg { width: 15px; height: 15px; }
    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }
    [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

    /* ── Main content ── */
    main {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      transition: var(--theme-transition);
    }

    main::-webkit-scrollbar { width: 6px; }
    main::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
    main::-webkit-scrollbar-track { background: transparent; }

    .main-inner {
      flex: 1;
      padding: 48px 64px;
      max-width: 100%;
      width: 100%;
    }

    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 60vh;
      color: var(--text-muted);
      gap: 16px;
    }

    .placeholder-icon {
      width: 64px;
      height: 64px;
      background: var(--border-subtle);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .placeholder-icon svg {
      opacity: 0.4;
      width: 28px;
      height: 28px;
    }

    .placeholder h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    .placeholder p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    /* ── Top bar inside main ── */
    .content-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 64px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 10;
      transition: var(--theme-transition);
    }

    .content-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .content-date-badge {
      background: var(--accent-dim);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: -0.01em;
    }

    /* ── Markdown styles ── */
    .md {
      line-height: 1.7;
    }

    .md h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.03em;
      color: var(--text);
      line-height: 1.3;
    }

    .md h1 + blockquote {
      margin-top: 0;
      margin-bottom: 32px;
    }

    .md h2 {
      font-size: 1.2rem;
      font-weight: 600;
      margin: 40px 0 14px;
      letter-spacing: -0.02em;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .md h2::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 1em;
      background: linear-gradient(180deg, var(--accent), var(--accent-light));
      border-radius: 2px;
      flex-shrink: 0;
    }

    .md h3 {
      font-size: 1rem;
      font-weight: 600;
      margin: 28px 0 10px;
      color: var(--text);
    }

    .md p {
      line-height: 1.85;
      margin-bottom: 16px;
      color: var(--text);
    }

    .md ul, .md ol {
      padding-left: 1.6em;
      margin-bottom: 16px;
    }

    .md li {
      line-height: 1.8;
      margin-bottom: 6px;
      color: var(--text);
    }

    .md blockquote {
      border-left: 3px solid var(--accent);
      margin: 20px 0;
      padding: 14px 20px;
      background: var(--accent-dim);
      border-radius: 0 var(--radius) var(--radius) 0;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .md blockquote p { margin-bottom: 0; color: var(--text-secondary); }

    .md code {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 7px;
      font-size: 0.82em;
      font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
      color: var(--code-color);
    }

    .md pre {
      background: var(--sidebar-bg);
      color: #e2e8f0;
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      overflow-x: auto;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: var(--shadow);
    }

    .md pre code {
      background: none;
      border: none;
      padding: 0;
      color: inherit;
      font-size: 0.875em;
    }

    .md strong {
      font-weight: 600;
      color: var(--strong-color);
    }

    .md em {
      color: var(--text-secondary);
    }

    .md table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      font-size: 0.875rem;
      box-shadow: var(--shadow-sm);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .md th, .md td {
      padding: 12px 16px;
      border: 1px solid var(--border);
      text-align: left;
    }

    .md th {
      background: var(--bg);
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .md tr:hover td { background: var(--border-subtle); }

    .md hr {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border) 20%, var(--border) 80%, transparent);
      margin: 36px 0;
    }

    .md a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid var(--accent-dim);
      transition: border-color 0.15s;
    }
    .md a:hover { border-color: var(--accent); }

    /* Loading state */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* fade in */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .md { animation: fadeIn 0.25s ease; }

    /* ── Mode tabs (Archive / Review) ── */
    .mode-tabs {
      display: flex;
      gap: 6px;
      padding: 12px 16px 0;
    }
    .mode-tab {
      flex: 1;
      padding: 9px 10px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius);
      background: transparent;
      color: rgba(255,255,255,0.55);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      letter-spacing: -0.01em;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      font-family: inherit;
    }
    .mode-tab:hover {
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.85);
    }
    .mode-tab.active {
      background: var(--accent-dim);
      color: var(--accent-light);
      border-color: var(--accent);
    }
    .mode-tab svg { width: 14px; height: 14px; }

    /* ── Review-mode sidebar stats ── */
    .review-stats-panel {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 20px;
      color: rgba(255,255,255,0.7);
      font-size: 0.82rem;
    }
    .review-stats-panel h4 {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin: 14px 4px 8px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 2px;
    }
    .stat-row:hover { background: rgba(255,255,255,0.04); }
    .stat-row .v { color: var(--accent-light); font-weight: 600; font-variant-numeric: tabular-nums; }
    .stat-row.highlight .v { color: #fbbf24; }

    /* ── Review pane (main area) ── */
    .review-pane {
      flex: 1;
      display: none;
      flex-direction: column;
      padding: 48px 64px;
      max-width: 880px;
      width: 100%;
      margin: 0 auto;
    }
    body.mode-review .review-pane { display: flex; }
    body.mode-review .archive-pane { display: none; }

    .review-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 28px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .review-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .review-progress {
      color: var(--text-secondary);
      font-size: 0.875rem;
      font-variant-numeric: tabular-nums;
    }
    .review-progress strong {
      color: var(--accent);
      font-weight: 600;
    }

    .flashcard {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 36px 40px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: var(--theme-transition), transform 0.15s, box-shadow 0.15s;
    }
    .flashcard:hover { box-shadow: var(--shadow-lg); }
    .flashcard.revealed { cursor: default; }

    .flashcard-meta {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .meta-chip {
      background: var(--code-bg);
      color: var(--text-secondary);
      font-size: 0.7rem;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 0.02em;
    }
    .meta-chip.date { color: var(--accent); background: var(--accent-dim); }
    .meta-chip.box {
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: white;
    }

    .flashcard-front {
      font-size: 1.15rem;
      line-height: 1.65;
      color: var(--text);
      flex: 1;
      display: flex;
      align-items: center;
      letter-spacing: -0.01em;
    }
    .flashcard-hint {
      margin-top: 24px;
      color: var(--text-muted);
      font-size: 0.78rem;
      text-align: center;
      letter-spacing: 0.04em;
    }

    .flashcard-back {
      font-size: 0.92rem;
      line-height: 1.75;
      color: var(--text);
    }
    .flashcard-back .md { animation: none; }
    .flashcard-back h1 { font-size: 1.25rem; }
    .flashcard-back h2 { font-size: 1.05rem; margin-top: 24px; }

    .flashcard-actions {
      display: flex;
      gap: 12px;
      position: sticky;
      bottom: 0;
      background: var(--surface);
      padding: 16px 40px 24px;
      margin: 24px -40px -36px;
      border-top: 1px solid var(--border-subtle);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    }
    .action-btn {
      flex: 1;
      padding: 14px 18px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: -0.01em;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .action-btn:hover { transform: translateY(-1px); }
    .action-btn:active { transform: translateY(0); }
    .action-btn.again {
      border-color: #fca5a5;
      color: #dc2626;
    }
    .action-btn.again:hover { background: #fef2f2; }
    .action-btn.ok {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }
    .action-btn.ok:hover { background: var(--accent-light); }
    [data-theme="dark"] .action-btn.again { color: #fca5a5; border-color: #7f1d1d; }
    [data-theme="dark"] .action-btn.again:hover { background: rgba(127,29,29,0.2); }

    .review-empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }
    .review-empty .big {
      font-size: 3rem;
      margin-bottom: 16px;
    }
    .review-empty h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .review-controls {
      display: flex;
      justify-content: center;
      margin-top: 18px;
      gap: 10px;
    }
    .ghost-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 6px;
      font-family: inherit;
    }
    .ghost-btn:hover { color: var(--text); background: var(--border-subtle); }

    /* Hide archive sidebar bits in review mode */
    body.mode-review .date-list,
    body.mode-review .sidebar-section-title { display: none; }
    body.mode-archive .review-stats-panel { display: none; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      aside { display: none; }
      .mobile-header { display: flex; }
      .content-header { padding: 16px 20px; }
      .main-inner { padding: 28px 20px; }
      .review-pane { padding: 28px 20px; }
      .flashcard { padding: 24px 20px; }
    }
  </style>
</head>
<body class="mode-archive">

  <div class="mobile-header">
    <h1>✦ English Corner</h1>
    <select id="mobileSelect" onchange="loadDate(this.value)">
      <option value="">選擇日期</option>
    </select>
  </div>

  <div class="layout">
    <aside>
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
            </svg>
          </div>
          <div>
            <div class="brand-text">English Corner</div>
            <div class="brand-sub">學習記錄存檔</div>
          </div>
        </div>
      </div>

      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="archive" onclick="switchMode('archive')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7h18M5 7v13a1 1 0 001 1h12a1 1 0 001-1V7M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3"/>
          </svg>
          歸檔
        </button>
        <button class="mode-tab" data-mode="review" onclick="switchMode('review')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
          複習
        </button>
      </div>

      <div class="sidebar-section-title">學習記錄</div>
      <nav class="date-list" id="dateList"></nav>

      <div class="review-stats-panel" id="reviewStats"></div>

      <div class="sidebar-footer">
        <div class="entry-count" id="entryCount">載入中…</div>
        <button class="theme-toggle" id="themeToggle" title="切換主題">
          <!-- Sun icon (shown in dark mode) -->
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <!-- Moon icon (shown in light mode) -->
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </aside>

    <main id="main">
      <div class="archive-pane" id="archivePane">
        <div class="placeholder">
          <div class="placeholder-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
            </svg>
          </div>
          <h3>選擇一個學習日期</h3>
          <p>從左側選擇日期，開始複習 English Corner 內容</p>
        </div>
      </div>
      <div class="review-pane" id="reviewPane"></div>
    </main>
  </div>

  <script>
    function formatDateLabel(dateStr) {
      const y = dateStr.slice(0, 4);
      const m = dateStr.slice(4, 6);
      const d = dateStr.slice(6, 8);
      const date = new Date(`${y}-${m}-${d}`);
      const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      return {
        main: `${y}/${m}/${d}`,
        sub: weekdays[date.getDay()],
      };
    }

    async function loadDate(dateStr) {
      if (!dateStr) return;

      document.querySelectorAll('.date-item').forEach(el => {
        el.classList.toggle('active', el.dataset.date === dateStr);
      });
      const mobileSelect = document.getElementById('mobileSelect');
      if (mobileSelect.value !== dateStr) mobileSelect.value = dateStr;

      const pane = document.getElementById('archivePane');
      pane.innerHTML = `
        <div class="placeholder">
          <div class="loading">
            <div class="spinner"></div>
            <span>載入中…</span>
          </div>
        </div>`;

      try {
        const res = await fetch(`src/English_${dateStr}.md`);
        if (!res.ok) throw new Error('Not found');
        const text = await res.text();

        const { y, m, d } = (() => {
          const y = dateStr.slice(0,4), m = dateStr.slice(4,6), d = dateStr.slice(6,8);
          return {y,m,d};
        })();
        const date = new Date(`${y}-${m}-${d}`);
        const weekdays = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

        pane.innerHTML = `
          <div class="content-header">
            <span class="content-title">${y}/${m}/${d} &nbsp;·&nbsp; ${weekdays[date.getDay()]}</span>
            <span class="content-date-badge">English Corner</span>
          </div>
          <div class="main-inner" id="mdContainer"></div>`;

        const div = document.createElement('div');
        div.className = 'md';
        div.innerHTML = marked.parse(text);
        document.getElementById('mdContainer').appendChild(div);
        document.getElementById('main').scrollTop = 0;
      } catch {
        pane.innerHTML = `
          <div class="placeholder">
            <div class="placeholder-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <h3>無法載入內容</h3>
            <p>找不到此日期的學習記錄</p>
          </div>`;
      }
    }

    // ───────────── SRS (Leitner box) ─────────────
    const SRS_KEY = 'ec-srs-state';
    const BOX_INTERVALS_DAYS = [1, 2, 4, 7, 15]; // box 1..5
    const DAY_MS = 86400000;

    let allEntries = [];
    let reviewQueue = [];
    let currentEntry = null;
    let cardRevealed = false;

    function loadSrsState() {
      try { return JSON.parse(localStorage.getItem(SRS_KEY)) || {}; }
      catch { return {}; }
    }
    function saveSrsState(state) {
      localStorage.setItem(SRS_KEY, JSON.stringify(state));
    }

    function isDue(entry, state, now) {
      const s = state[entry.id];
      if (!s) return true; // new card
      return s.nextReviewAt <= now;
    }

    function computeDueQueue() {
      const state = loadSrsState();
      const now = Date.now();
      // Newest entries first — fresher in memory feels nicer to review.
      return allEntries
        .filter(e => isDue(e, state, now))
        .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    }

    function markCard(entryId, result) {
      const state = loadSrsState();
      const prev = state[entryId] || { box: 0, history: [] };
      let nextBox = prev.box;
      if (result === 'ok') nextBox = Math.min(5, (prev.box || 0) + 1);
      else nextBox = 1;
      const intervalDays = BOX_INTERVALS_DAYS[nextBox - 1] || 1;
      state[entryId] = {
        box: nextBox,
        nextReviewAt: Date.now() + intervalDays * DAY_MS,
        history: [...(prev.history || []).slice(-9), { at: Date.now(), result }],
      };
      saveSrsState(state);
    }

    function renderReviewStats() {
      const state = loadSrsState();
      const now = Date.now();
      const total = allEntries.length;
      const boxes = [0, 0, 0, 0, 0];
      let dueNow = 0;
      let newCards = 0;
      for (const e of allEntries) {
        const s = state[e.id];
        if (!s) { newCards++; dueNow++; continue; }
        if (s.box >= 1 && s.box <= 5) boxes[s.box - 1]++;
        if (s.nextReviewAt <= now) dueNow++;
      }
      const learned = total - newCards;
      const stats = document.getElementById('reviewStats');
      stats.innerHTML = `
        <h4>今日進度</h4>
        <div class="stat-row highlight"><span>待複習</span><span class="v">${dueNow}</span></div>
        <div class="stat-row"><span>未學過</span><span class="v">${newCards}</span></div>
        <div class="stat-row"><span>已學習</span><span class="v">${learned} / ${total}</span></div>
        <h4>盒子分佈</h4>
        ${boxes.map((n, i) => `
          <div class="stat-row"><span>Box ${i + 1} <span style="opacity:.5">· ${BOX_INTERVALS_DAYS[i]}d</span></span><span class="v">${n}</span></div>
        `).join('')}
      `;
    }

    function renderCurrentCard() {
      const pane = document.getElementById('reviewPane');
      if (!currentEntry) {
        pane.innerHTML = `
          <div class="review-empty">
            <div class="big">🎉</div>
            <h3>今天的複習完成了</h3>
            <p>暫無待複習卡片，明天再來！</p>
            <div class="review-controls">
              <button class="ghost-btn" onclick="resetSrsState()">重設所有進度</button>
            </div>
          </div>`;
        return;
      }
      const state = loadSrsState();
      const s = state[currentEntry.id];
      const boxLabel = s ? `Box ${s.box}` : '新卡';
      const date = currentEntry.date;
      const dateLabel = `${date.slice(0,4)}/${date.slice(4,6)}/${date.slice(6,8)}`;
      const tagChips = (currentEntry.tags || []).map(t => `<span class="meta-chip">${t}</span>`).join('');

      const done = allEntries.length - reviewQueue.length;
      const total = allEntries.length;

      pane.innerHTML = `
        <div class="review-header">
          <div>
            <div class="review-title">複習模式</div>
            <div class="review-progress">剩 <strong>${reviewQueue.length + 1}</strong> 張待複習 · 共 ${total} 張</div>
          </div>
        </div>
        <div class="flashcard" id="flashcard" onclick="revealCard()">
          <div class="flashcard-meta">
            <span class="meta-chip date">${dateLabel}</span>
            <span class="meta-chip box">${boxLabel}</span>
            ${tagChips}
          </div>
          <div class="flashcard-front">${escapeHtml(currentEntry.front)}</div>
          <div class="flashcard-hint">點擊翻面 ↻</div>
        </div>
        <div class="review-controls">
          <button class="ghost-btn" onclick="skipCard()">跳過這張</button>
        </div>
      `;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function revealCard() {
      if (!currentEntry || cardRevealed) return;
      cardRevealed = true;
      const card = document.getElementById('flashcard');
      card.classList.add('revealed');
      card.onclick = null;
      const date = currentEntry.date;
      const dateLabel = `${date.slice(0,4)}/${date.slice(4,6)}/${date.slice(6,8)}`;
      const state = loadSrsState();
      const s = state[currentEntry.id];
      const boxLabel = s ? `Box ${s.box}` : '新卡';
      const tagChips = (currentEntry.tags || []).map(t => `<span class="meta-chip">${t}</span>`).join('');

      card.innerHTML = `
        <div class="flashcard-meta">
          <span class="meta-chip date">${dateLabel}</span>
          <span class="meta-chip box">${boxLabel}</span>
          ${tagChips}
        </div>
        <div class="flashcard-back">
          <div class="md"></div>
        </div>
        <div class="flashcard-actions">
          <button class="action-btn again" onclick="answer('again')">✗ 再複習</button>
          <button class="action-btn ok" onclick="answer('ok')">✓ 記住了</button>
        </div>
      `;
      card.querySelector('.md').innerHTML = marked.parse(currentEntry.body);
    }

    function answer(result) {
      if (!currentEntry) return;
      markCard(currentEntry.id, result);
      advanceCard(result === 'again');
    }

    function skipCard() {
      // Push to end of queue without changing state
      if (currentEntry) reviewQueue.push(currentEntry);
      advanceCard(false);
    }

    function advanceCard(requeue) {
      if (requeue && currentEntry) reviewQueue.push(currentEntry);
      currentEntry = reviewQueue.shift() || null;
      cardRevealed = false;
      renderCurrentCard();
      renderReviewStats();
    }

    function startReviewSession() {
      reviewQueue = computeDueQueue();
      currentEntry = reviewQueue.shift() || null;
      cardRevealed = false;
      renderCurrentCard();
      renderReviewStats();
    }

    function resetSrsState() {
      if (!confirm('確定要重設所有複習進度嗎？')) return;
      localStorage.removeItem(SRS_KEY);
      startReviewSession();
    }

    function switchMode(mode) {
      document.body.classList.toggle('mode-review', mode === 'review');
      document.body.classList.toggle('mode-archive', mode === 'archive');
      document.querySelectorAll('.mode-tab').forEach(el => {
        el.classList.toggle('active', el.dataset.mode === mode);
      });
      if (mode === 'review') startReviewSession();
    }

    async function init() {
      try {
        const [datesRes, entriesRes] = await Promise.all([
          fetch('src/index.json'),
          fetch('src/entries.json'),
        ]);
        if (!datesRes.ok) throw new Error();
        const { dates } = await datesRes.json();
        if (entriesRes.ok) {
          const data = await entriesRes.json();
          allEntries = data.entries || [];
        }

        const list = document.getElementById('dateList');
        const sel = document.getElementById('mobileSelect');
        const countEl = document.getElementById('entryCount');

        dates.forEach(dateStr => {
          const { main, sub } = formatDateLabel(dateStr);

          const btn = document.createElement('button');
          btn.className = 'date-item';
          btn.dataset.date = dateStr;
          btn.innerHTML = `
            <div class="date-dot"></div>
            <div class="date-info">
              <span class="label">${main}</span>
              <span class="sub">${sub}</span>
            </div>`;
          btn.onclick = () => loadDate(dateStr);
          list.appendChild(btn);

          const opt = document.createElement('option');
          opt.value = dateStr;
          opt.textContent = main;
          sel.appendChild(opt);
        });

        countEl.textContent = `共 ${dates.length} 筆記錄 · ${allEntries.length} 張卡`;

        if (dates.length > 0) loadDate(dates[0]);
        renderReviewStats();
      } catch {
        document.getElementById('archivePane').innerHTML = `
          <div class="placeholder">
            <div class="placeholder-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <h3>設定錯誤</h3>
            <p>找不到 src/index.json，請確認設定是否正確</p>
          </div>`;
      }
    }

    // ── Theme toggle ──
    const html = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');

    function applyTheme(theme) {
      html.setAttribute('data-theme', theme);
      localStorage.setItem('ec-theme', theme);
    }

    function initTheme() {
      const saved = localStorage.getItem('ec-theme');
      if (saved) {
        applyTheme(saved);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        applyTheme('dark');
      } else {
        applyTheme('light');
      }
    }

    themeToggle.addEventListener('click', () => {
      const isDark = html.getAttribute('data-theme') === 'dark';
      applyTheme(isDark ? 'light' : 'dark');
    });

    initTheme();
    init();
  </script>
</body>
</html>
